schema: spec-driven

# Контекст, який отримує кожен артефакт, apply та archive.
# Тут лише обмеження, які агент не виведе з коду; решта — в AGENTS.md і docs/.
context: |
  Expo/React Native застосунок для iOS та Android (Expo SDK — мажорна версія `expo` з package.json).
  Перед кодом з Expo/EAS/React Native API звіряйся з документацією саме цієї версії
  (https://docs.expo.dev/versions/v<major>.0.0/, https://docs.expo.dev/llms.txt), не з памʼяті.
  Навігація — лише Expo Router: екрани в src/app/, `_layout.tsx` — навігатори,
  не-маршрутний код (компоненти, хуки, сервіси) — поза src/app/.
  Каталоги ios/ та android/ генеруються (CNG) — нативне налаштування лише через app.json і config plugins.
  Дизайн екранів — канвас Claude Design (посилання і як читати — docs/design.md);
  кожен новий або змінений екран звіряти з відповідним артбордом.
  Узгоджені патерни (клавіатура, вибір значень, навбар, таб-бар, свайпи, кнопки, Reanimated тощо)
  — docs/patterns/README.md; рішення мають їм відповідати.
  Інтерфейс застосунку український. Усі артефакти OpenSpec пиши українською;
  ключові слова специфікацій (SHALL, MUST, WHEN, THEN) та заголовки дельт лишай англійською.

rules:
  proposal:
    - Коротко, до 300 слів
    - Назви екрани в src/app/, які зачіпає зміна, і що лишається поза обсягом
    - Якщо потрібна нова бібліотека — поясни, чому не підходить вбудований модуль Expo
  design:
    - Посилайся на артборд дизайну для кожного екрана, що змінюється
    - Вкажи, які файли docs/patterns/*.md застосовуються; якщо патерн змінюється або зʼявляється новий — опиши його
    - Окремо вкажи, чи потрібна нова development build (нативний модуль) замість Expo Go / OTA-оновлення
  specs:
    - Сценарії описують поведінку з погляду користувача, з українськими текстами інтерфейсу як у дизайні
  tasks:
    - Якщо змінюється або додається патерн — окрема задача оновити docs/patterns/ (файл і README.md)
    - Остання задача — запустити npx expo lint і npx tsc --noEmit та виправити помилки

operations:
  apply:
    guidance:
      - Нові залежності лише через npx expo install, не npm install
      - Не редагуй ios/ та android/ вручну
      - Перед версткою екрана прочитай відповідний файл docs/patterns/ і артборд з docs/design.md
      - Задача не виконана, доки npx expo lint і npx tsc --noEmit не проходять
  archive:
    guidance:
      - Перевір, що docs/patterns/ оновлено, якщо зміна вводила або змінювала патерн
      - Коротко підсумуй українською, що потрапило в зміну
